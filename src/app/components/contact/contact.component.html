<section  id="contact" class="bg-gray-100 py-16 min-h-screen  px-6  flex flex-col items-center">
  <h2 class="text-4xl font-extrabold text-gray-800 mb-12 relative">
    Contact
    <span class="block w-20 h-1 bg-blue-500 mt-2 mx-auto rounded"></span>
  </h2>
  <div class="container mx-auto px-6 md:px-12 lg:px-20">
    <div class="grid md:grid-cols-2 gap-12 items-center">
      <!-- Left Side Info -->
      <div>
        <h2 class="text-4xl font-extrabold text-gray-800 mb-6">Get in Touch</h2>
        <p class="text-lg text-gray-600 mb-6">
          I welcome any inquiries or opportunities. If you have a question, would like to discuss a potential
          collaboration, or wish to connect professionally, please feel free to reach out. I will respond at the
          earliest convenience.
        </p>
        <a href="tel:+91 6388498390"
          class="inline-block px-6 py-3 bg-red-500 text-white font-semibold rounded-lg shadow hover:bg-red-600 transition">
          📞 Call Me
        </a>
      </div>
      <!-- Right Side Form -->
      <form (submit)="sendEmail($event)" class="bg-white p-8 rounded-xl shadow-lg space-y-4">
        <input type="text" name="user_name" placeholder="Your Name"
          class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-400 outline-none" required />
        <input type="email" name="user_email" placeholder="Your Email"
          class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-400 outline-none" required />
        <textarea name="message" rows="5" placeholder="Your Message"
          class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-400 outline-none"
          required></textarea>
        <button type="submit"
          class="w-full py-3 bg-blue-500 text-white font-semibold rounded-lg shadow hover:bg-blue-600 transition">
          ✉️ Send Message
        </button>
      </form>
    </div>
  </div>
</section>
