<section id="projects" class="min-h-screen py-16 px-6 bg-gray-100 flex flex-col items-center">
  <h2 class="text-4xl font-extrabold text-gray-800 mb-12 relative">
    Projects
    <span class="block w-20 h-1 bg-blue-500 mt-2 mx-auto rounded"></span>
  </h2>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8 w-full max-w-6xl">
    @for (project of projects; track $index) {
      <div class="bg-white rounded-xl shadow-md overflow-hidden transform hover:-translate-y-2 hover:shadow-xl transition duration-300">

        <!-- Project Image -->
         <a href="{{project.live}}">
        <div class="h-48 bg-gray-200 flex items-center justify-center overflow-hidden">
          <img *ngIf="project.image" [src]="project.image" [alt]="project.title" class="w-full h-full object-cover">
        </div>
</a>
        <!-- Content -->
        <div class="p-6 flex flex-col justify-between h-full">
          <div>
            <h3 class="text-2xl font-semibold text-gray-800 mb-2">{{ project.title }}</h3>
            <p class="text-gray-600 mb-4">{{ project.desc }}</p>
          </div>
        </div>
      </div>
    }
  </div>
</section>
