<section  id="experience" class="py-20 bg-gray-50 relative">
  <div class="max-w-6xl mx-auto px-6 md:px-12">
    <h2 class="text-3xl md:text-4xl font-extrabold text-gray-800 mb-12 text-center " >
      My Experience
      <span class="block w-20 h-1 bg-blue-500 mt-2 mx-auto rounded-full"></span>
    </h2>
    <!-- Horizontal Cards Container -->
    <div class="flex gap-6 overflow-x-auto pb-4 scrollbar-thin scrollbar-thumb-blue-400 scrollbar-track-gray-200">
      <div *ngFor="let exp of experiences"
           class="flex-shrink-0 w-80 bg-white p-6 rounded-xl shadow hover:shadow-md transition duration-300 relative border border-gray-200">
        <!-- Icon / Circle -->
        <div class="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-4">
          <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3"></path>
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"></circle>
          </svg>
        </div>

        <!-- Card Content -->
        <h3 class="text-lg font-bold text-gray-800 mb-1">{{exp.role}}</h3>
        <p class="text-gray-500 text-sm mb-2">{{exp.company}} | {{exp.duration}}</p>
        <p class="text-gray-600 text-sm text-left whitespace-pre-line">{{exp.description}}</p>

        <!-- Decorative underline -->
        <span class="block w-16 h-1 bg-blue-500 mt-4 mx-auto rounded-full"></span>
      </div>
    </div>
  </div>
</section>
