<!-- Navbar -->
<nav class="fixed top-0 left-0 w-full bg-gradient-to-r from-gray-900/95 via-gray-800/90 to-gray-900/95 backdrop-blur-md shadow-lg z-50">
  <div class="max-w-7xl mx-auto flex justify-between items-center px-6 py-4">

    <!-- Logo -->
    <div class="text-2xl font-bold text-white tracking-wide">
      <a href="/" class="hover:text-blue-400 transition">MyPortfolio</a>
    </div>

    <!-- Desktop Menu -->
    <ul class="hidden md:flex space-x-8 text-gray-200 font-medium
               md:text-lg md:font-semibold lg:text-xl lg:font-bold">
      <li><a href="#hero" class="hover:text-blue-400 transition">Home</a></li>
      <li><a href="#about" class="hover:text-blue-400 transition">About</a></li>
      <li><a href="#skills" class="hover:text-blue-400 transition">Skills</a></li>
      <li><a href="#experience" class="hover:text-blue-400 transition">Experience</a></li>
      <li><a href="#projects" class="hover:text-blue-400 transition">Projects</a></li>
      <li><a href="#contact" class="hover:text-blue-400 transition">Contact</a></li>
    </ul>

    <!-- Mobile Toggle Button -->
    <button (click)="toggleMenu()" class="md:hidden text-3xl text-white focus:outline-none">
      <span *ngIf="!isMenuOpen">&#9776;</span>
      <span *ngIf="isMenuOpen">&times;</span>
    </button>
  </div>
</nav>

<!-- Mobile Menu Overlay -->
<div
  class="fixed inset-0 bg-gradient-to-b from-gray-900/95 via-gray-800/95 to-gray-900/90 backdrop-blur-md
         flex flex-col items-center justify-center space-y-8 text-white
         text-2xl font-semibold transform transition-transform duration-500 z-40"
  [ngClass]="{ 'translate-x-0': isMenuOpen, '-translate-x-full': !isMenuOpen }"
>
  <a href="#hero" class="hover:text-blue-400 transition" (click)="toggleMenu()">Home</a>
  <a href="#about" class="hover:text-blue-400 transition" (click)="toggleMenu()">About</a>
  <a href="#skills" class="hover:text-blue-400 transition" (click)="toggleMenu()">Skills</a>
  <a href="#experience" class="hover:text-blue-400 transition" (click)="toggleMenu()">Experience</a>
  <a href="#projects" class="hover:text-blue-400 transition" (click)="toggleMenu()">Projects</a>
  <a href="#contact" class="hover:text-blue-400 transition" (click)="toggleMenu()">Contact</a>
</div>
